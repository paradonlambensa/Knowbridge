# Render Blueprint — https://render.com/docs/blueprint-spec
# Dashboard → New → Blueprint → เลือก repo นี้ แล้วกรอก MONGODB_URI ตอนสร้าง
services:
  - type: web
    name: knowbridge
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
