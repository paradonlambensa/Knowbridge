# Render Blueprint — https://render.com/docs/blueprint-spec
# Dashboard → New → Blueprint → เลือก repo นี้ แล้วกรอก MONGODB_URI ตอนสร้าง
services:
  # เว็บหลัก (Node.js) — frontend/ + backend/
  - type: web
    name: knowbridge
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # รูปโปรไฟล์ (Cloudinary) — ค่าจากหน้า Dashboard ของ Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # การ์ดโปรไฟล์ (PHP 8.4 + Apache) — card-service/
  # ดึงโปรไฟล์สาธารณะจาก API ของเว็บหลัก แล้ววาดเป็นรูป SVG
  # สร้างเสร็จแล้วเอา URL ของ service นี้ไปตั้งเป็น CARD_SERVICE_URL ของเว็บหลัก ปุ่มการ์ดถึงจะขึ้น
  - type: web
    name: knowbridge-card
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./card-service/Dockerfile
    dockerContext: ./card-service
    healthCheckPath: /health.php
    buildFilter:
      paths:
        - card-service/**
    envVars:
      - key: KNOWBRIDGE_API_URL
        value: https://knowbridge-ufsn.onrender.com
